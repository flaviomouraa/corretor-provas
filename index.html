<style>
/* Layout: app de uma coluna, barra superior fixa e abas embaixo (alcance do polegar). Papel frio + tinta de caneta azul. */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --sunk: #E3E8F0;
  --ink: #141B2E;
  --muted: #586179;
  --line: #D3DAE6;
  --grid: #E4E8EF;
  --line-strong: #9AA5BB;
  --accent: #2340C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE3FF;
  --ok: #17784A;
  --ok-soft: #D9F2E5;
  --bad: #BE2534;
  --bad-soft: #FBE0E3;
  --warn: #A55F00;
  --warn-soft: #FDEBCF;
  --seq1: #C9D3FA; --seq2: #8FA2EE; --seq3: #5470DA; --seq4: #1F37A8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1320; --surface: #161D2D; --sunk: #1D2538; --ink: #E7EBF3; --muted: #9AA4BA; --grid: #232C40;
    --line: #283149; --line-strong: #4A5672; --accent: #8EA2FF; --accent-ink: #0E1320; --accent-soft: #23305E;
    --ok: #4FC98D; --ok-soft: #133426; --bad: #FF7A85; --bad-soft: #3C1A20; --warn: #F2AE55; --warn-soft: #3A2A12;
    --seq1: #2B3B7A; --seq2: #4862C8; --seq3: #7C93F5; --seq4: #BAC8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #161D2D; --sunk: #1D2538; --ink: #E7EBF3; --muted: #9AA4BA; --grid: #232C40;
  --line: #283149; --line-strong: #4A5672; --accent: #8EA2FF; --accent-ink: #0E1320; --accent-soft: #23305E;
  --ok: #4FC98D; --ok-soft: #133426; --bad: #FF7A85; --bad-soft: #3C1A20; --warn: #F2AE55; --warn-soft: #3A2A12;
  --seq1: #2B3B7A; --seq2: #4862C8; --seq3: #7C93F5; --seq4: #BAC8FF;
    color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 880px; margin: 0 auto; }

.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tight { gap: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }

main.gutter { padding-block: 20px 110px; }
.view { display: flex; flex-direction: column; gap: 18px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .inner { display: grid; grid-template-columns: repeat(4, 1fr); }

.tab svg { width: 22px; height: 22px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; }
.btn:hover { border-color: var(--accent); }

.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 0.9rem; min-width: 0; }
label.field .hint { font-weight: 400; color: var(--muted); }
input[type=text], input[type=password], input[type=number], select {
  min-height: 46px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface); width: 100%; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.grid2 > * { min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.list { display: flex; flex-direction: column; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.keystrip { font-family: var(--font-mono); font-size: 0.9rem; letter-spacing: 0.04em; background: var(--sunk); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1.5px dashed var(--line-strong); border-radius: var(--r); }
.note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.875rem; }

.bubbles { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 4px 18px; }
.bubbles.vertical { grid-template-columns: minmax(0, 1fr); max-width: 380px; gap: 4px; }
.bubbles.vertical .qrow { border-bottom: 1px solid var(--line); border-radius: 0; padding-block: 5px; }
.bubbles.vertical .qrow:last-child { border-bottom: 0; }
.qrow { flex-wrap: nowrap; }
.qrow { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 8px; }
.qrow .qn { font-family: var(--font-mono); width: 2.2em; text-align: right; color: var(--muted); font-size: 0.9rem; }
.qrow.st-ok { background: var(--ok-soft); }
.qrow.st-bad { background: var(--bad-soft); }
.qrow.st-blank, .qrow.st-multi { background: var(--warn-soft); }
.qrow .flag { font-size: 0.7rem; font-weight: 700; color: var(--warn); margin-left: auto; text-transform: uppercase; letter-spacing: .05em; }
.bub { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 700; font-size: 0.85rem; cursor: pointer; position: relative; color: var(--muted); padding: 0; flex: none; }
.bub.sel { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.bub.key::after { content: ""; position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--surface); }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--font-body); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.scan-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 760px) { .scan-wrap { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } }
.scan-img { width: 100%; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; font-family: var(--font-body); }
.chart text { fill: var(--muted); font-size: 12px; }
.chart .hit { fill: transparent; }
.keylist { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
.qbars { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.qbar { background: var(--sunk); border-radius: 6px; padding: 5px 6px; font-size: 0.75rem; position: relative; overflow: hidden; }
.qbar .fill { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ok); }
.qbar.low .fill { background: var(--bad); }
.qbar b { font-family: var(--font-mono); }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.82rem; padding: 6px 9px; border-radius: 6px; max-width: 240px; line-height: 1.3; }

.lock { min-height: 100%; display: grid; place-items: center; padding-block: 32px; }
.lock-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
.lock-art { width: 56px; height: 56px; color: var(--accent); }
.lock h1 { font-size: 2rem; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; min-height: 40px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.err { color: var(--bad); font-weight: 700; font-size: 0.9rem; }
.seg.tres { grid-template-columns: repeat(3, 1fr); max-width: 420px; }
.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.cor { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.cor[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cor .amostra { width: 20px; height: 20px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }

.modal-back { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 24, 0.55); display: grid; place-items: end center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .modal-back { place-items: center; } }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 999px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
.busy { position: fixed; inset: 0; z-index: 25; background: rgba(8,12,24,.6); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.1rem; }
.zoombox { overflow: auto; max-height: 70vh; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); }
.zoombox canvas { display: block; max-width: none; border: 0; border-radius: 0; }
.sheet-preview { max-width: 100%; max-height: 50vh; margin: 0 auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
ul.tips { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } .score .big { font-size: 2.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============================================================
   Utilidades
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = "ABCDE";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtNum = (n) => (Math.round(n * 10) / 10).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtDate = (t) => new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
const fmtShort = (t) => new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const letter = (a) => (a === null || a === undefined ? "–" : a === -1 ? "*" : LET[a]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ============================================================
   Contas e cofre criptografado
   Cada conta (usuário + senha) tem seu próprio cofre AES-GCM com
   chave derivada da senha (PBKDF2). A senha nunca é gravada.
   Imagens das provas corrigidas ficam no IndexedDB, também cifradas.
   ============================================================ */
const PREFIX = "corretor-provas.conta.";
const LAST_USER = "corretor-provas.ultimo-usuario";
const LEGACY_KEY = "corretor-provas.cofre.v1";
const ITER = 250000;
const te = new TextEncoder(), td = new TextDecoder();
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function b64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const b = atob(s); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
const normUser = (u) => String(u || "").trim().toLowerCase();
async function acctId(user) {
  const h = await crypto.subtle.digest("SHA-256", te.encode("corretor-provas:" + normUser(user)));
  return Array.from(new Uint8Array(h).slice(0, 12), (b) => b.toString(16).padStart(2, "0")).join("");
}
async function deriveKey(pw, salt, iter = ITER) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encBytes(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, ct: await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes) }; }
async function decBytes(key, o) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: o.iv }, key, o.ct); }
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");

/* Aparência: cor de destaque e modo claro/escuro, guardados neste aparelho */
const APAR_KEY = "corretor-provas.aparencia";
const CORES = {

/* IndexedDB: imagens cifradas dos cartões corrigidos */
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("corretor-provas", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("imagens");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("imagens", mode), req = fn(t.objectStore("imagens"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(k, v) { return this.run("readwrite", (s) => s.put(v, k)); },
  get(k) { return this.run("readonly", (s) => s.get(k)); },
  del(k) { return this.run("readwrite", (s) => s.delete(k)); },
  async keys(prefix) { const all = await this.run("readonly", (s) => s.getAllKeys()); return all.filter((k) => String(k).startsWith(prefix)); },

  let r = false;
  if (sync.on) {
    try { await api("/rest/v1/imagens", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: { user_id: sync.uid, id: rid, iv: b64(enc.iv), ct: b64(enc.ct) } }); r = true; }

async function saveFile(filename, data) {

      const d = await window.claude.use("downloads");

      await d.save({ filename, data });
      return true;
    }
    const blob = data instanceof Blob ? data : new Blob([data]);
    if (window.AndroidBridge) { // app Android: salva em Downloads
      const ext = filename.split(".").pop().toLowerCase();
      const mime = { pdf: "application/pdf", png: "image/png", csv: "text/csv", json: "application/json" }[ext] || blob.type || "application/octet-stream";

}

      S.acct = id; S.salt = crypto.getRandomValues(new Uint8Array(16)); S.key = await deriveKey(a, S.salt);
      S.data = exampleData({ name, username: user });
      if (syncEnabled()) {
        busy(true, "Criando conta no servidor…");
        try { await syncStart(user, a, { create: true }); }
        catch (err) {
          console.warn(err);
          if (err.code === "exists" || err.code === "confirm") { busy(false); Object.assign(S, { acct: null, key: null, data: null }); return renderLock(err.userMsg, keep); }
          sync.err = explain(err); // a conta fica no aparelho e sincroniza quando o servidor aceitar
        }
      }
      await persist();
      busy(false); enterApp();
    };
    $("#restore").onclick = () => { S.importMode = "replace"; $("#file-backup").click(); };
  }
  const f = [...L.querySelectorAll("form input")].find((i) => !i.value); f && f.focus();
}
async function login(user, pw) {
  await cloudReady();
  const id = await acctId(user), blob = await vaultBlob(id);
  Object.assign(S, { acct: id, key: null, salt: null, data: null });
  let localOk = false;
  if (blob) {
    try { const v = await openVault(blob, pw); Object.assign(S, { key: v.key, salt: v.salt, data: v.data }); localOk = true; }
    catch (e) { if (!syncEnabled()) throw e; } // a senha pode ter sido trocada em outro aparelho
  }
  if (syncEnabled()) {
    const online = await syncStart(user, pw).catch((e) => {
      if (localOk && !["wrongpw", "confirm"].includes(e.code)) { sync.err = e.code === "offline" ? "" : explain(e); return false; }
      throw e;
    });
    if (!online && !localOk) throw syncErr("Sem internet, e esta conta ainda não está neste aparelho. Conecte-se e tente de novo.", "offline");
    ls.set(LAST_USER, user.trim());
    return;
  }
  if (localOk) {
    ls.set(LAST_USER, user.trim());
    if (cloud.db && !(await cloudGet("conta-" + id))) persist(); // conta antiga só do aparelho: copia para a nuvem
    return;
  }
  const legacy = ls.get(LEGACY_KEY); // dados da versão anterior (só senha): passam para este usuário
  if (!legacy) throw new Error("conta");
  const v = await openVault(legacy, pw), d = v.data;
  d.version = 2; d.user = { name: user, username: user }; d.prefs = d.prefs || { lastTurma: "" };
  Object.assign(S, { acct: id, key: v.key, salt: v.salt, data: d });
  await persist(); ls.del(LEGACY_KEY);
}

async function wipeAccount(id) {

}

async function gabAction(act, id) {
  const g = gabById(id);
  if (act === "reveal") { S.reveal[id] = !S.reveal[id]; return render(); }
  if (act === "edit") { S.edit = JSON.parse(JSON.stringify(g)); return render(); }
  if (act === "scan") { S.scanGab = id; return go("corrigir"); }
  if (act === "sheet") return sheetModal(g);
  if (act === "del") {
    const rs = resultsOf(id);
    if (!(await confirmBox("Excluir gabarito?", `“${esc(g.name)}” será apagado${rs.length ? ` junto com ${rs.length} prova${rs.length > 1 ? "s" : ""} corrigida${rs.length > 1 ? "s" : ""}` : ""}. Não dá para desfazer.`, "Excluir"))) return;
    tomb(id); for (const r of rs) tomb(r.id);
    S.data.gabaritos = S.data.gabaritos.filter((x) => x.id !== id);
    S.data.results = S.data.results.filter((r) => r.gabId !== id);
    for (const r of rs) deleteImage(r.id);

  }
}

function previewOf(canvas, cands = []) {
  const sc = Math.min(1, 520 / Math.max(canvas.width, canvas.height));
  const c = document.createElement("canvas"); c.width = Math.round(canvas.width * sc); c.height = Math.round(canvas.height * sc);
  const ctx = c.getContext("2d"); ctx.drawImage(canvas, 0, 0, c.width, c.height);
  ctx.lineWidth = 3; ctx.strokeStyle = "#E08A00";
  for (const p of cands) { ctx.beginPath(); ctx.arc(p.x * sc, p.y * sc, Math.max(8, Math.sqrt(p.area) * sc * 0.9), 0, 7); ctx.stroke(); }
  return c.toDataURL("image/jpeg", 0.8);
}

    unknown: `O cartão tem o código ${res.code}, que não corresponde a nenhum gabarito desta conta. Confira se a prova é deste gabarito. Cartões impressos antes desta versão do app precisam ser gerados de novo.`,
    nocode: "Achei o cartão, mas não consegui ler o código embaixo dele. Escolha o gabarito na lista da tela Corrigir e tente de novo.",
    corners: "Os 4 pontos marcados não formam um retângulo. Tente marcar de novo, tocando no centro de cada quadrado do canto.",
  }[res.reason];
  const canMark = canvas && res.reason !== "unknown";
  openModal(`<h2>Não deu para corrigir</h2><p>${msg}</p>

  s += `<path d="M${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    s += `<circle cx="${sx(i)}" cy="${sy(p.avg10)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<text x="${sx(i)}" y="${base + 18}" text-anchor="middle">P${i + 1}</text>`;
    s += `<circle class="hit" cx="${sx(i)}" cy="${sy(p.avg10)}" r="18" data-tip="P${i + 1} · ${esc(p.g.name)} (${fmtShort(p.date)}): média ${fmtNum(p.avg10)} de 10 · ${p.n} prova${p.n > 1 ? "s" : ""}"/>`;
  });
  const last = pts[pts.length - 1];
  s += `<text x="${sx(pts.length - 1)}" y="${sy(last.avg10) - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${fmtNum(last.avg10)}</text>`;
  return s + `</svg>`;
}
async function exportChart(id, filename) {
  const box = $(`#${id}`), svg = box && box.querySelector("svg"); if (!svg) return;
  const css = getComputedStyle(document.documentElement), tok = (v) => css.getPropertyValue(v).trim();
  const W = +svg.getAttribute("width"), H = +svg.getAttribute("height"), title = box.dataset.title || "";
  let src = svg.outerHTML.replace(/<(rect|circle) class="hit"[^>]*>(<\/\1>)?/g, "").replace(/var\((--[a-z-]+)\)/g, (_, v) => tok(v));
  src = src.replace(/<text(?![^>]*style=)/g, `<text fill="${tok("--muted")}"`).replace(/style="fill:([^;"]+)/g, 'fill="$1" style="');
  const pad = 20, th = title ? 30 : 0;
  const wrap = `<svg xmlns="http://www.w3.org/2000/svg" width="${W + pad * 2}" height="${H + pad * 2 + th}" font-family="Arial, Helvetica, sans-serif" font-size="12"><rect width="100%" height="100%" fill="${tok("--surface")}"/>${title ? `<text x="${pad}" y="${pad + 14}" font-size="16" font-weight="700" fill="${tok("--ink")}">${esc(title)}</text>` : ""}<g transform="translate(${pad} ${pad + th})">${src.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')}</g></svg>`;
  const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(wrap); await img.decode();
  const c = document.createElement("canvas"); c.width = (W + pad * 2) * 2; c.height = (H + pad * 2 + th) * 2;
  const ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  if (await saveFile(filename, blob)) toast("Gráfico pronto");
}

async function onBackupFile(file) {
  if (!file) return;
  const text = await file.text();
  const pw = await askPassword("Restaurar backup", "Digite a senha que estava em uso quando este backup foi gerado.");
  if (pw === null) return;
  busy(true, "Abrindo backup…");
  let v;
  try { v = await openVault(text, pw); } catch { busy(false); return toast("Senha errada ou arquivo que não é um backup do Corretor."); }
  const { images = {}, ...data } = v.data;
  if (S.importMode === "replace" || !S.data) {
    const user = data.user && data.user.username;
    if (!user) { busy(false); return toast("Este backup é de uma versão antiga. Crie uma conta e use Restaurar backup na aba Conta."); }
    Object.assign(S, { acct: await acctId(user), key: v.key, salt: v.salt, data: { ...data, version: 2 } });
    if (syncEnabled()) {
      try { await syncStart(user, pw); }
      catch (e) { busy(false); Object.assign(S, { acct: null, key: null, data: null }); return toast(e.userMsg || "Não consegui ligar a sincronização. Tente de novo."); }
    }
    for (const [rid, b] of Object.entries(images)) await putImageEnc(rid, await encBytes(S.key, unb64(b))).catch(() => {});
    await persist(); busy(false); toast(`Backup restaurado. Seu usuário é @${user}.`); return enterApp();
  }
  let ng = 0, nr = 0;
  for (const g of data.gabaritos || []) if (!gabById(g.id)) { if (gabByCode(g.code)) g.code = newCode(); S.data.gabaritos.push(stamp(g)); ng++; }
  for (const r of data.results || []) if (!S.data.results.find((x) => x.id === r.id)) {
    S.data.results.push(stamp(r)); nr++;
    if (images[r.id]) await putImageEnc(r.id, await encBytes(S.key, unb64(images[r.id]))).catch(() => {});
  }
  await persist(); busy(false); toast(`Restaurados: ${ng} gabarito(s) e ${nr} prova(s)`); render();
}
